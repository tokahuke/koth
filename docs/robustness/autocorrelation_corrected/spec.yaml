# The correction: a strategy told sigma * sqrt((1 + phi) / (1 - phi)), the
# long-run noise of an AR(1) reading, so its filter credits a run of readings
# with the information they carry. 1.363 at phi 0.3, 2.000 at 0.6, 4.359 at 0.9.
out: data/autocorrelation_corrected.pkl
size: 1000
workers: 2
contestants:
  KotH, k = 3: KotH3
  KotH, k = 2: KotH2
  Gittins index: Gittins
  Thompson sampling: ProbabilityMatching
  z-test at 5%: Elimination
environments:
  normal: &base
    gamma: 0.999
    horizon: 3000
    sigma: 1.0
    effect: 0.0
    effect_std: 0.5
    arms: 6
  phi 0.3: {<<: *base, kind: ar1, phi: 0.3}
  phi 0.3 corrected: {<<: *base, kind: ar1, phi: 0.3, told: {sigma: 1.363}}
  phi 0.6: {<<: *base, kind: ar1, phi: 0.6}
  phi 0.6 corrected: {<<: *base, kind: ar1, phi: 0.6, told: {sigma: 2.000}}
  phi 0.9: {<<: *base, kind: ar1, phi: 0.9}
  phi 0.9 corrected: {<<: *base, kind: ar1, phi: 0.9, told: {sigma: 4.359}}
