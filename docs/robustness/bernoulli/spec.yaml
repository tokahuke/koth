out: data/bernoulli.pkl
size: 1000
workers: 2
contestants:
  KotH, k = 3: KotH3
  KotH, k = 2: KotH2
  Gittins index: Gittins
  Thompson sampling: ProbabilityMatching
  z-test at 5%: Elimination
# A bernoulli world's sigma is sqrt(rate (1 - rate) / trials), which the
# environment derives. The Gaussian reference is that value at 1000 draws,
# 0.00689, so the first rung of the ladder changes the noise's shape and not
# its size. Effects are N(0, 0.0035), a 7% relative lift on the base rate.
environments:
  gaussian:
    gamma: 0.999
    horizon: 3000
    sigma: 0.00689
    effect: 0.0
    effect_std: 0.0035
    arms: 6
  trials 1000: &base
    kind: bernoulli
    rate: 0.05
    trials: 1000
    gamma: 0.999
    horizon: 3000
    effect: 0.0
    effect_std: 0.0035
    arms: 6
  trials 300: {<<: *base, trials: 300}
  trials 100: {<<: *base, trials: 100}
  trials 30: {<<: *base, trials: 30}
  trials 10: {<<: *base, trials: 10}
