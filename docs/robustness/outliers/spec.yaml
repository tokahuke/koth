out: data/outliers.pkl
size: 1000
workers: 2
contestants:
  KotH, k = 3: KotH3
  KotH, k = 2: KotH2
  Gittins index: Gittins
  Thompson sampling: ProbabilityMatching
  z-test at 5%: Elimination
environments:
  normal: &base
    gamma: 0.999
    horizon: 3000
    sigma: 1.0
    effect: 0.0
    effect_std: 0.5
    arms: 6
  df 10: {<<: *base, kind: student, df: 10}
  df 6: {<<: *base, kind: student, df: 6}
  df 4: {<<: *base, kind: student, df: 4}
  df 3: {<<: *base, kind: student, df: 3}
