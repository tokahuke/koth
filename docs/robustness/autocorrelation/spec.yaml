out: data/autocorrelation.pkl
size: 1000
workers: 2
contestants:
  KotH, k = 3: KotH3
  KotH, k = 2: KotH2
  Gittins index: Gittins
  Thompson sampling: ProbabilityMatching
  z-test at 5%: Elimination
environments:
  normal: &base
    gamma: 0.999
    horizon: 3000
    sigma: 1.0
    effect: 0.0
    effect_std: 0.5
    arms: 6
  phi 0.3: {<<: *base, kind: ar1, phi: 0.3}
  phi 0.6: {<<: *base, kind: ar1, phi: 0.6}
  phi 0.9: {<<: *base, kind: ar1, phi: 0.9}
